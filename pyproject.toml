[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsm-option-pricing"      # Change this if the name is taken on PyPI
version = "0.1.0"
description = "American Option Pricing Via Least Squares Monte Carlo"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Columbia MAFN LSM Team" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy",
    "pandas",
    "matplotlib"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["LSM*"]

[project.urls]
Homepage = "https://github.com/sockiesss/LSM_Option_Pricing"